<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>Detail knihy</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container-layout">
      <header class="navbar">
        <a href="../index.html" class="btn-print">← Zpět na přehled</a>
        <h2>Detail</h2>

        <div class="nav-actions">
          <a href="./login.html" class="btn-login">Přihlásit se</a>
        </div>
      </header>

      <div id="books-detail"></div>

      <script>
        const container = document.getElementById("books-detail");
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get("id");

        if (bookId) {
          fetch(`/api/books.php?id=${encodeURIComponent(bookId)}`)
            .then((response) => {
              if (!response.ok) {
                throw new Error(`Kniha s ID ${bookId} neexistuje.`);
              }
              return response.json();
            })
            .then((book) => {
              container.innerHTML = "";

              // Vytvoření obalového divu
              const detailDiv = document.createElement("div");
              detailDiv.className = "book-detail";

              const title = document.createElement("h3");
              title.textContent = book.title;

              const author = document.createElement("p");
              author.textContent = `Autor: ${book.author}`;

              const year = document.createElement("p");
              year.textContent = `Rok vydání: ${book.year}`;

              const annotation = document.createElement("p");
              annotation.textContent = `Anotace: ${book.annotation}`;

              const rating = document.createElement("p");
              rating.textContent = `Hodnocení: ${book.rating} / 5`;

              // Sestavení do sebe
              detailDiv.appendChild(title);
              detailDiv.appendChild(author);
              detailDiv.appendChild(year);
              detailDiv.appendChild(annotation);
              detailDiv.appendChild(rating);

              container.appendChild(detailDiv);
            })
            .catch((error) => {
              container.innerHTML = "";
              const errParagraph = document.createElement("p");
              errParagraph.className = "error-message";
              errParagraph.textContent = error.message;
              container.appendChild(errParagraph);
            });
        } else {
          container.innerHTML = "<p>Chyba: V adrese chybí ID knihy.</p>";
        }
      </script>
    </div>
  </body>
</html>
