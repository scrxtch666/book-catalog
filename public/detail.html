<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>Detail knihy</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container-layout">
      <header class="navbar">
        <a href="../index.html" class="btn-print">← Zpět na přehled</a>
        <h2>Detail</h2>

        <div class="nav-actions">
          <a href="./login.html" class="btn-login">Přihlásit se</a>
        </div>
      </header>

      <div id="books-detail"></div>

      <script>
        const container = document.getElementById("books-detail");

        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get("id");

        if (bookId) {
          fetch(`/api/books.php?id=${bookId}`)
            .then((response) => {
              if (!response.ok) {
                throw new Error(`Kniha s id ${bookId} neexistuje.`);
              }
              return response.json();
            })
            .then((book) => {
              container.innerHTML = `
                <div class="book-detail">
                      <h3>${book.title}</h3>
                      <p>Autor: ${book.author}</p>
                      <p>Rok vydání: ${book.year}</p>
                      <p>Anotace: ${book.annotation}</p>
                      <p>Hodnocení: ${book.rating} / 5</p>
                </div>
              `;
            })
            .catch((error) => {
              container.innerHTML = `<p class="error-message">${error.message}</p>`;
            });
        } else {
          container.innerHTML = "<p>Chyba: V adrese chybí ID knihy.</p>";
        }
      </script>
    </div>
  </body>
</html>
