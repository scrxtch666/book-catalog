<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <title>Evidence knih</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container-layout">
      <header class="navbar no-print">
        <h2>Seznam knih</h2>

        <div class="nav-actions">
          <a href="#" class="btn-print" id="print-btn">Vytisknout seznam</a>
          <a href="./login.html" class="btn-login">Přihlásit se</a>
        </div>
      </header>

      <div id="books"></div>

      <script>
        const container = document.getElementById("books");

        function escapeHtml(text) {
          const div = document.createElement("div");
          div.textContent = text ?? "";
          return div.innerHTML;
        }

        function loadBooks() {
          fetch("/api/books.php", { cache: "no-store" })
            .then((response) => response.json())
            .then((books) => {
              container.innerHTML = "";

              books.forEach((book) => {
                const div = document.createElement("div");

                div.innerHTML = `
                  <a href="./detail.html?id=${encodeURIComponent(book.id)}">
                    <div class="book">
                        <h3>${escapeHtml(book.title)}</h3>
                        <p>Autor: ${escapeHtml(book.author)}</p>
                        <p>Rok vydání: ${escapeHtml(book.year)}</p>
                    </div>
                  </a>
                `;

                container.appendChild(div);
              });
            })
            .catch((err) => console.error("Chyba při načítání knih:", err));
        }

        loadBooks();

        document.getElementById("print-btn").addEventListener("click", (e) => {
          e.preventDefault();
          window.print();
        });

        window.addEventListener("pageshow", (event) => {
          if (event.persisted) {
            loadBooks();
          }
        });
      </script>
    </div>
  </body>
</html>
