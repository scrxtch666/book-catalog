<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evidence knih</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container-layout">
      <header class="navbar no-print">
        <h2>Seznam knih</h2>

        <div class="nav-actions">
          <a href="#" class="btn-print" id="print-btn">Vytisknout seznam</a>
          <a href="./login.html" class="btn-login">Přihlásit se</a>
        </div>
      </header>

      <div id="books"></div>

      <script>
        const container = document.getElementById("books");

        function loadBooks() {
          fetch("/api/books.php", { cache: "no-store" })
            .then((response) => response.json())
            .then((books) => {
              container.innerHTML = "";

              books.forEach((book) => {
                const link = document.createElement("a");
                link.href = `./detail.html?id=${encodeURIComponent(book.id)}`;
                link.className = "book-card-link";

                const div = document.createElement("div");
                div.className = "book";

                const title = document.createElement("h3");
                title.textContent = book.title;

                const author = document.createElement("p");
                author.textContent = `Autor: ${book.author}`;

                const year = document.createElement("p");
                year.textContent = `Rok vydání: ${book.year}`;

                div.appendChild(title);
                div.appendChild(author);
                div.appendChild(year);

                link.appendChild(div);
                container.appendChild(link);
              });
            })
            .catch((err) => console.error("Chyba při načítání knih:", err));
        }

        loadBooks();

        document.getElementById("print-btn").addEventListener("click", (e) => {
          e.preventDefault();
          window.print();
        });

        window.addEventListener("pageshow", (event) => {
          if (event.persisted) {
            loadBooks();
          }
        });
      </script>
    </div>
  </body>
</html>
